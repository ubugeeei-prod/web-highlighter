<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Highlighter</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f2f4f1;
        --surface: #fbfbf8;
        --surface-muted: #eef1ec;
        --surface-pressed: #e5e9e2;
        --text: #171a1f;
        --muted: #646c75;
        --subtle: #5f686f;
        --border: #7f8c83;
        --border-strong: #aeb8aa;
        --accent: #175c4a;
        --action: #175c4a;
        --action-hover: #104a3c;
        --action-text: #ffffff;
        --focus: #267762;
        --syntax-keyword: #7b3fc1;
        --syntax-type: #0c6f88;
        --syntax-string: #736200;
        --syntax-comment: #67736e;
        font:
          13px/1.46 ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #090c0d;
          --surface: #111516;
          --surface-muted: #171c1d;
          --surface-pressed: #202728;
          --text: #edf2ef;
          --muted: #a8b2ae;
          --subtle: #78837f;
          --border: #2d3634;
          --border-strong: #4d5a56;
          --accent: #85d3b6;
          --action: #17362d;
          --action-hover: #1d4439;
          --action-text: #d9f3e8;
          --focus: #85d3b6;
          --syntax-keyword: #d6b5ff;
          --syntax-type: #8bd8ef;
          --syntax-string: #d9cf86;
          --syntax-comment: #8fa29a;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 348px;
        margin: 0;
        padding: 0;
        color: var(--text);
        background: var(--page);
      }

      .popup-shell {
        display: grid;
        gap: 16px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .title {
        display: grid;
        gap: 3px;
        min-width: 0;
      }

      .kicker {
        margin: 0;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
        gap: 7px;
        min-height: 28px;
        padding: 0 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--muted);
        background: var(--surface-muted);
        font-size: 11px;
        font-weight: 700;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent);
      }

      .field {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .select-control {
        position: relative;
        display: block;
      }

      .select-control::after {
        position: absolute;
        top: 50%;
        right: 12px;
        width: 8px;
        height: 8px;
        border-right: 1.5px solid var(--subtle);
        border-bottom: 1.5px solid var(--subtle);
        content: "";
        pointer-events: none;
        transform: translateY(-70%) rotate(45deg);
      }

      select {
        width: 100%;
        min-height: 42px;
        padding: 0 38px 0 12px;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        background: var(--surface-muted);
        font: inherit;
        font-weight: 650;
        appearance: none;
        outline: none;
      }

      select:hover {
        border-color: var(--border-strong);
        background: var(--surface);
      }

      select:focus-visible,
      button:focus-visible {
        border-color: var(--focus);
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .sample-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        min-height: 36px;
        padding: 0 11px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface-muted);
        font:
          12px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          Consolas,
          monospace;
        white-space: nowrap;
      }

      .sample-keyword {
        color: var(--syntax-keyword);
        font-weight: 700;
      }

      .sample-type {
        color: var(--syntax-type);
        font-weight: 700;
      }

      .sample-string {
        color: var(--syntax-string);
      }

      .sample-comment {
        color: var(--syntax-comment);
      }

      button {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--accent);
        border-radius: 7px;
        color: var(--action-text);
        background: var(--action);
        font: inherit;
        font-weight: 700;
        letter-spacing: 0;
        cursor: pointer;
        transition:
          background-color 140ms ease,
          border-color 140ms ease,
          transform 140ms ease;
      }

      button:hover {
        border-color: var(--action-hover);
        background: var(--action-hover);
      }

      button:active {
        transform: translateY(1px);
        background: var(--action-hover);
      }

      p {
        margin: 0;
        color: var(--subtle);
        font-size: 12px;
      }

      p:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="popup-shell">
      <header class="header">
        <div class="title">
          <p class="kicker">Extension</p>
          <h1>Web Highlighter</h1>
        </div>
        <span class="status" aria-label="Ready">
          <span class="status-dot" aria-hidden="true"></span>
          Ready
        </span>
      </header>
      <label class="field" for="theme">
        <span>Theme</span>
        <span class="select-control">
          <select id="theme"></select>
        </span>
      </label>
      <div class="sample-strip" aria-hidden="true">
        <span class="sample-keyword">fn</span>
        <span class="sample-type">Type</span>
        <span class="sample-string">"text"</span>
        <span class="sample-comment">// note</span>
      </div>
      <button id="enable" type="button">Grant Site Access</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
