name: Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WEB_HIGHLIGHTER_DOCS_BASE: /
  WEB_HIGHLIGHTER_DOCS_SITE_URL: https://web-highlighter.void.app

jobs:
  build:
    name: Build docs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install pnpm dependencies through Vite+
        run: nix develop --command vpr install

      - name: Build Ox Content docs
        run: nix develop --command vpr docs:build

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: dist/docs/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy docs to Void
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    environment:
      name: docs
      url: https://web-highlighter.void.app
    permissions:
      contents: read
      id-token: write
    env:
      VOID_API_URL: ${{ vars.VOID_API_URL || 'https://api.void.cloud' }}
      VOID_PROJECT: ${{ vars.VOID_PROJECT || 'web-highlighter' }}
      WEB_HIGHLIGHTER_DOCS_BASE: /
      WEB_HIGHLIGHTER_DOCS_SITE_URL: https://web-highlighter.void.app
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install pnpm dependencies through Vite+
        run: nix develop --command vpr install

      - name: Deploy Ox Content docs to Void
        run: nix develop --command vpr docs:deploy
